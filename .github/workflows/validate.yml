name: DigiOps release

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Validate and package static app
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check app and gallery files
        run: |
          set -euo pipefail
          for file in index.html styles.css drawing-contract.js powder-trace.js image-processor.js geometric-design.js studio.js drawable-designs.js gallery.js gallery-data.js gallery.css; do
            test -s "$file"
          done
          grep -q 'href="styles.css' index.html
          grep -q 'src="geometric-design.js' index.html
          grep -q 'src="studio.js' index.html
          grep -q 'src="drawable-designs.js' index.html
          grep -q 'src="drawing-contract.js' index.html
          grep -q 'src="powder-trace.js' index.html
          grep -q 'src="image-processor.js' index.html
          test -s docs/RANGOLI_DRAWING_RULES.md
          test -s AGENTS.md
          test -s CONTRIBUTING.md
          test "$(find assets/designs -type f -name '*.webp' | wc -l | tr -d ' ')" -eq 31

      - name: Check JavaScript syntax and gallery manifest
        run: |
          set -euo pipefail
          for f in drawing-contract.js powder-trace.js image-processor.js geometric-design.js studio.js drawable-designs.js gallery-data.js gallery.js tests/drawing-contract.test.js tests/runtime-smoke.test.js tests/gallery-outline-audit.cjs; do node --check "$f"; done
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const context={window:{}};
          vm.runInNewContext(fs.readFileSync('gallery-data.js','utf8'),context);
          const items=context.window.RangoliDesignLibraryData;
          if(!Array.isArray(items)||items.length!==31)throw Error('Expected exactly 31 gallery entries');
          for(const x of items){
            if(!/^assets\/designs\/[a-z0-9-]+\.webp$/.test(x.src)||!fs.existsSync(x.src))throw Error('Missing gallery image: '+x.src);
          }
          const drawable=items.filter(x=>x.mode==='vector_draw'),previews=items.filter(x=>x.mode==='image_preview');
          if(drawable.length!==6||previews.length!==25)throw Error('Expected 6 vector designs and 25 image previews');
          console.log('Verified',drawable.length,'drawable and',previews.length,'preview designs');
          NODE

      - name: Validate drawable vector geometry and gallery integration
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const context={window:{}};
          vm.runInNewContext(fs.readFileSync('drawable-designs.js','utf8'),context);
          vm.runInNewContext(fs.readFileSync('gallery-data.js','utf8'),context);
          const models=context.window.RangoliDrawableDesigns;
          const items=context.window.RangoliDesignLibraryData;
          const expected=['a-01','a-06','a-07','a-09','a-14','a-16'];
          assert.deepStrictEqual(Object.keys(models).sort(),expected);
          for(const id of expected){
            const m=models[id],item=items.find(x=>x.id===id);
            assert(item&&item.mode==='vector_draw'&&item.modelId===id,id+' manifest mismatch');
            assert(m.dots.length>0&&m.strokes.length>0&&m.fills.length>0,id+' missing geometry');
            assert(m.strokes.every(s=>s.points.length>1&&s.points.every(p=>p.every(Number.isFinite))),id+' bad stroke');
            assert(m.fills.every(f=>f.points.length>=3&&f.points.every(p=>p.every(Number.isFinite))),id+' bad region');
            const coords=m.strokes.flatMap(s=>s.points).flat();
            assert(coords.every(x=>x>=0&&x<=900),id+' coordinates beyond canvas');
          }
          const studio=fs.readFileSync('studio.js','utf8'),gallery=fs.readFileSync('gallery.js','utf8');
          assert(studio.includes('window.RangoliStudioSelectVector'));
          assert(studio.includes('libraryVectorFrame('));
          assert(gallery.includes('window.RangoliStudioSelectVector'));
          console.log('Validated 6 geometry models, 25 image previews, and vector routing');
          NODE

      - name: Enforce mandatory drawing stages and imported image tracing
        run: |
          node tests/drawing-contract.test.js
          node tests/runtime-smoke.test.js

      - name: Install image decoder for exhaustive gallery audit
        run: python3 -m pip install --user Pillow

      - name: Audit all 31 gallery assets for genuine outline geometry
        run: node tests/gallery-outline-audit.cjs

      - name: Publish individual gallery outline diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rangoli-outline-audit
          path: artifacts/outline-audit.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Package public website
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p dist/assets
          cp index.html styles.css drawing-contract.js powder-trace.js image-processor.js geometric-design.js drawable-designs.js studio.js gallery.css gallery.js gallery-data.js dist/
          cp -R assets/designs dist/assets/
          test -s dist/index.html
          test "$(find dist/assets/designs -type f -name '*.webp' | wc -l | tr -d ' ')" -eq 31
          printf 'RangoliMotion commit %s\n' "$GITHUB_SHA" > dist/BUILD_INFO.txt

      - name: Publish DigiOps release artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digiops-release
          path: dist/
          if-no-files-found: error
          retention-days: 5
