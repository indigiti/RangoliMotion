name: DigiOps release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate and package static app
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify entry files and links
        run: |
          set -euo pipefail
          for file in index.html styles.css geometric-design.js studio.js; do
            test -s "$file"
          done
          grep -q 'href="styles.css"' index.html
          grep -q 'src="geometric-design.js"' index.html
          grep -q 'src="studio.js"' index.html

      - name: Check JavaScript syntax
        run: |
          node --check geometric-design.js
          node --check studio.js

      - name: Package public website
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html styles.css geometric-design.js studio.js dist/
          test -s dist/index.html
          printf 'RangoliMotion commit %s\n' "$GITHUB_SHA" > dist/BUILD_INFO.txt

      - name: Publish DigiOps release artifact
        uses: actions/upload-artifact@v4
        with:
          name: digiops-release
          path: dist/
          if-no-files-found: error
          retention-days: 5
