name: Validate static app

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify entry files and links
        shell: bash
        run: |
          test -s index.html
          test -s styles.css
          test -s geometric-design.js
          test -s studio.js
          grep -q 'href="styles.css"' index.html
          grep -q 'src="geometric-design.js"' index.html
          grep -q 'src="studio.js"' index.html

      - name: Check JavaScript syntax
        run: |
          node --check geometric-design.js
          node --check studio.js
